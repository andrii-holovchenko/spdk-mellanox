---

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  # VM_HOST Pool:
  VM_START_NUM: "001"
  VM_END_NUM: "016"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - pre-test
  - test

unittests-build-job:
  tags: [k8s, linux, x86_64]
  stage: pre-test
  image: "$FEDORA_IMAGE"
  variables:
    XLIO_SHA: 3.60.0
  parallel:
    matrix:
      - BUILD_TYPE: verbs-debug
        FLAGS: --with-rdma --enable-debug --enable-werror
      - BUILD_TYPE: mlx5_dv-debug
        FLAGS: --with-rdma=mlx5_dv --enable-debug --enable-werror
      - BUILD_TYPE: mlx5_dv-release
        FLAGS: --with-rdma=mlx5_dv --enable-werror
  script:
    - .ci/install_xlio.sh $XLIO_SHA
    - ./configure ${FLAGS} --with-crypto --with-vfio-user --with-xlio=/tmp/libxlio/install --with-shared
    - make -j4
    - ./test/unit/unittest.sh

test-nvmf-job:
  tags: [vm_host, x86_64]
  stage: test
  before_script:
    - .ci/prepare_vm.sh
  script:
    - ./configure --enable-debug --with-rdma=mlx5_dv
    - make -j${nproc}
    - ./scripts/setup.sh
    - NET_TYPE=phy ./test/nvmf/host/bdevperf.sh --transport=rdma
    - NET_TYPE=phy ./test/nvmf/host/discovery.sh --transport=rdma
    - NET_TYPE=phy ./test/nvmf/host/identify.sh --transport=rdma

autotest-vm_host-matrix:
  tags: [vm_host, x86_64]
  stage: test
  parallel:
    matrix:
      - TEST_TYPE: [nvme, accel, fsdev]
  before_script:
    - .ci/prepare_vm.sh
  script:
    - ./autorun.sh .ci/autotest-${TEST_TYPE}.conf
  after_script:
    - tar czf $CI_PROJECT_DIR/${TEST_TYPE}_artifacts.tar -C $CI_PROJECT_DIR/.. output
  artifacts:
    name: ${TEST_TYPE}_artifacts
    paths:
      - $CI_PROJECT_DIR/${TEST_TYPE}_artifacts.tar
    expire_in: 3 days
    when: always

test-crypto-job:
  tags: [vm_host, x86_64]
  stage: test
  variables:
    # VMs 17-20 have BlueField3 vfs with crypto
    VM_START_NUM: "017"
    VM_END_NUM: "020"
    CI_DUT_RDMA: "mlx5_0"
  before_script:
    - .ci/prepare_vm.sh
  script:
    - ./configure --enable-debug --with-rdma=mlx5_dv --with-crypto
    - make -j${nproc}
    - ./scripts/setup.sh
    - ./test/accel/mlx5/accel_mlx5_crypto_key_upper_lba.sh --allowed-devs=${CI_DUT_RDMA}
    - ./test/accel/mlx5/accel_mlx5_crypto.sh --allowed-devs=${CI_DUT_RDMA}
    - ./test/accel/mlx5/accel_mlx5_crypto.sh --allowed-devs=${CI_DUT_RDMA} --transport=rdma
  after_script:
    - tar czf $CI_PROJECT_DIR/crypto_artifacts.tar -C $CI_PROJECT_DIR/.. output
  artifacts:
    name: crypto_artifacts
    paths:
      - $CI_PROJECT_DIR/crypto_artifacts.tar
    expire_in: 3 days
    when: always

coverity-job:
  tags: [k8s, linux, x86_64]
  stage: test
  image: "$COV_IMAGE"
  script:
    - apt-get -q update
    - ./scripts/pkgdep.sh
    - ./configure --with-rdma=mlx5_dv --disable-unit-tests
    - cov-build --dir cov_build make -j 4
    - cov-analyze --jobs auto --security --concurrency --dir cov_build
    - cov-format-errors --dir cov_build --html-output cov_build/html
    - nr=$(cov-format-errors --dir cov_build |& awk '/Processing [0-9]+ errors?/ { print $2 }')
    - exit $nr
  variables:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/cov/bin
    CC: gcc-9
  allow_failure: true
  artifacts:
    name: coverity
    paths:
      - cov_build/html/
    expire_in: 1 week
    when: always

code-style-job:
  tags: [k8s, linux, x86_64]
  stage: pre-test
  image: "$COV_IMAGE"
  script:
    - apt-get -q update
    - ./scripts/pkgdep.sh --developer-tools
    - ./scripts/check_format.sh

check-so-deps-job:
  tags: [vm_host, x86_64]
  stage: test
  variables:
    GIT_FETCH_EXTRA_FLAGS: "--tags"
  script:
    - ./configure --with-rdma=mlx5_dv --enable-debug --enable-werror --with-shared
    - make -j4
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/Mellanox/spdk_team/spdk-abi.git test/make/abi
    - sudo ./test/make/check_so_deps.sh

